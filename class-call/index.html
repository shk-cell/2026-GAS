<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
  :root {
    --accent: #D93025; --accent-dark: #B3261E; --accent-soft: #FDECEA;
    --ink: #1F2633; --muted: #667085; --faint: #98A2B3;
    --line: #E4E7EC; --bg: #F5F6F8; --card: #FFFFFF; --ok: #12B76A; --ok-soft: #ECFDF3;
    --r: 12px; --gap: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #FDB022; outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Top bar */
  .top { background: var(--card); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1040px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
  .brand i { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 16px; }
  .summary { color: var(--muted); font-size: 14px; }

  .page { max-width: 1040px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .card-body { padding: 18px; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); }

  /* Small segmented buttons */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { height: 30px; padding: 0 12px; border: 0; border-left: 1px solid var(--line); background: var(--card); font-size: 13px; color: var(--muted); }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { background: var(--bg); color: var(--ink); }

  /* Receiver list: fixed columns so every row lines up */
  .list { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 150px 52px; align-items: center; gap: 12px; height: 52px; padding: 0 18px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #FAFBFC; }
  .row.on-pick { background: var(--accent-soft); }
  .row input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; color: var(--muted); background: var(--bg); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.on { color: #067647; background: var(--ok-soft); }
  .pill.on::before { background: var(--ok); }
  .del { justify-self: end; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--faint); font-size: 13px; }
  .del:hover { background: var(--bg); color: var(--accent); }
  .empty { padding: 36px 18px; text-align: center; color: var(--muted); }

  /* Message form */
  .field + .field { margin-top: 16px; }
  .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  .input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { display: block; height: 160px; resize: vertical; font-size: 18px; line-height: 1.5; }
  .meta { display: flex; justify-content: flex-end; margin-top: 6px; font-size: 12px; color: var(--faint); }
  .target { color: var(--muted); font-size: 14px; }
  .target b { color: var(--ink); }
  .btn { height: 44px; padding: 0 28px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; }
  .btn:hover:not(:disabled) { background: var(--accent-dark); }
  .btn:disabled { opacity: .4; cursor: default; }
  .note { min-height: 22px; margin: 10px 0 0; font-size: 14px; font-weight: 600; color: var(--accent); }
  .note.ok { color: #067647; }

  /* Login */
  .login { max-width: 380px; margin: 80px auto 0; }
  .login .btn { width: 100%; margin-top: 14px; }

  @media (max-width: 820px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .row { grid-template-columns: 22px minmax(0, 1fr) auto 52px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i>📢</i>교실 호출</div>
    <div class="summary" id="summary"></div>
  </div>
</header>

<!-- Password -->
<main id="v-login" class="page">
  <div class="card login">
    <div class="card-head"><h2>관리자 로그인</h2></div>
    <div class="card-body">
      <div class="field">
        <label for="pw">비밀번호</label>
        <input id="pw" class="input" type="password" autocomplete="current-password">
      </div>
      <button id="btn-login" class="btn" type="button">들어가기</button>
      <p class="note" id="msg-login"></p>
    </div>
  </div>
</main>

<!-- Main -->
<main id="v-main" class="page hidden">
  <div class="grid">
    <section class="card">
      <div class="card-head">
        <h2>받을 곳</h2>
        <div class="seg">
          <button type="button" id="sel-on">켜진 곳</button>
          <button type="button" id="sel-all">전체</button>
          <button type="button" id="sel-none">해제</button>
        </div>
      </div>
      <ul class="list" id="receivers"></ul>
    </section>

    <section class="card">
      <div class="card-head"><h2>메시지</h2></div>
      <div class="card-body">
        <div class="field">
          <label for="from">보내는 사람 (선택)</label>
          <input id="from" class="input" maxlength="20" placeholder="예: 교무부">
        </div>
        <div class="field">
          <label for="text">내용</label>
          <textarea id="text" maxlength="200" placeholder="예: 홍길동 지금 교무실로 와라"></textarea>
          <div class="meta"><span id="chars">0 / 200</span></div>
        </div>
      </div>
      <div class="card-foot">
        <span class="target" id="target">받을 곳을 고르세요</span>
        <button id="btn-send" class="btn" type="button" disabled>보내기</button>
      </div>
      <p class="note" id="msg-send" aria-live="polite" style="padding: 0 18px 14px; margin: 0"></p>
    </section>
  </div>
</main>

<script>
const REFRESH_MS = 5000;

let password = '';
let receivers = [];
const picked = new Set();   // names checked by the admin, kept across refreshes

function $(id) { return document.getElementById(id); }

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    const run = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    run[fn].apply(run, args);
  });
}

function errText(e) {
  return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');
}

// ----- Login -----

async function login(pw) {
  $('msg-login').textContent = '';
  try {
    const r = await call('loadAdmin', pw);
    password = pw;
    try { sessionStorage.setItem('call_pw', pw); } catch (e) {}
    $('v-login').classList.add('hidden');
    $('v-main').classList.remove('hidden');
    apply(r);
    setTimeout(refreshLoop, REFRESH_MS);
  } catch (e) {
    $('msg-login').textContent = errText(e);
  }
}

$('btn-login').addEventListener('click', function () { login($('pw').value); });
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login($('pw').value); });

function apply(r) {
  receivers = r.receivers;
  // Forget picks for receivers that were removed
  Array.from(picked).forEach(function (n) {
    if (!receivers.some(function (x) { return x.name === n; })) picked.delete(n);
  });
  const on = receivers.filter(function (x) { return x.online; }).length;
  $('summary').textContent = receivers.length ? '수신기 ' + receivers.length + '곳 · 켜짐 ' + on + '곳' : '';
  renderReceivers();
  updateSend();
}

async function refreshLoop() {
  try { apply(await call('loadAdmin', password)); } catch (e) {}
  setTimeout(refreshLoop, REFRESH_MS);
}

// ----- Receivers -----

function renderReceivers() {
  const list = $('receivers');
  list.innerHTML = '';
  if (!receivers.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 접속한 수신기가 없어요. 교실 컴퓨터에서 Receiver.exe를 켜면 여기에 나타나요.';
    list.appendChild(li);
    return;
  }
  receivers.forEach(function (r) {
    const li = document.createElement('li');
    li.className = 'row' + (picked.has(r.name) ? ' on-pick' : '');

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = picked.has(r.name);
    box.setAttribute('aria-label', r.name);

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = r.name;
    nm.title = r.name;

    const pill = document.createElement('span');
    pill.className = 'pill' + (r.online ? ' on' : '');
    pill.textContent = r.online ? '켜짐' : '꺼짐' + (r.seen ? ' · ' + r.seen.slice(6) : '');
    if (!r.online && r.seen) pill.title = '마지막 접속 ' + r.seen;

    // The last column is always there (empty when online) so every row lines up.
    let last = document.createElement('span');
    if (!r.online) {
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '지우기';
      del.title = '목록에서 지우기 (다시 켜지면 돌아와요)';
      del.addEventListener('click', async function (e) {
        e.stopPropagation();
        if (!confirm(r.name + ' 을(를) 목록에서 지울까요?')) return;
        try { apply(await call('removeReceiver', password, r.name)); } catch (err) { note(errText(err), false); }
      });
      last = del;
    }

    function toggle(on) {
      if (on) picked.add(r.name); else picked.delete(r.name);
      box.checked = on;
      li.classList.toggle('on-pick', on);
      updateSend();
    }
    box.addEventListener('click', function (e) { e.stopPropagation(); toggle(box.checked); });
    li.addEventListener('click', function () { toggle(!picked.has(r.name)); });

    li.appendChild(box);
    li.appendChild(nm);
    li.appendChild(pill);
    li.appendChild(last);
    list.appendChild(li);
  });
}

function pickWhere(test) {
  picked.clear();
  receivers.forEach(function (r) { if (test(r)) picked.add(r.name); });
  renderReceivers();
  updateSend();
}
$('sel-on').addEventListener('click', function () { pickWhere(function (r) { return r.online; }); });
$('sel-all').addEventListener('click', function () { pickWhere(function () { return true; }); });
$('sel-none').addEventListener('click', function () { pickWhere(function () { return false; }); });

// ----- Send -----

function note(text, ok) {
  $('msg-send').className = 'note' + (ok ? ' ok' : '');
  $('msg-send').textContent = text;
}

function updateSend() {
  const n = picked.size;
  const off = receivers.filter(function (r) { return picked.has(r.name) && !r.online; }).length;
  const target = $('target');
  target.innerHTML = '';
  if (n) {
    const b = document.createElement('b');
    b.textContent = n + '곳';
    target.appendChild(b);
    target.appendChild(document.createTextNode('에 보내요' + (off ? ' · 꺼진 곳 ' + off : '')));
  } else {
    target.textContent = '받을 곳을 고르세요';
  }
  $('chars').textContent = $('text').value.length + ' / 200';
  $('btn-send').disabled = !n || !$('text').value.trim();
}

$('text').addEventListener('input', updateSend);
$('text').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('btn-send').disabled) $('btn-send').click();
});
$('from').addEventListener('input', function () {
  try { localStorage.setItem('call_from', $('from').value); } catch (e) {}
});

$('btn-send').addEventListener('click', async function () {
  $('btn-send').disabled = true;
  note('보내는 중…', false);
  try {
    const r = await call('sendMessage', password, { to: Array.from(picked), text: $('text').value, from: $('from').value });
    note('보냈어요. 켜진 곳에는 5초 안에 떠요.', true);
    $('text').value = '';
    apply(r);
  } catch (e) {
    note(errText(e), false);
    updateSend();
  }
});

// ----- Start -----

try { $('from').value = localStorage.getItem('call_from') || ''; } catch (e) {}
if (typeof google === 'undefined' || !google.script) {
  $('msg-login').textContent = '이 파일은 Apps Script 웹 앱으로 배포한 주소에서 열어야 동작해요.';
} else {
  let saved = '';
  try { saved = sessionStorage.getItem('call_pw') || ''; } catch (e) {}
  if (saved) login(saved);
}
</script>
</body>
</html>
